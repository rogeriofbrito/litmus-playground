apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-api.fullname" . }}
  labels:
    {{- include "order-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "order-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "order-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
      - name: wait
        image: "{{ .Values.wait.image.repository }}:{{ .Values.wait.image.tag }}"
        imagePullPolicy: {{ .Values.wait.image.pullPolicy }}
        command:
          - sh
          - '-c'
          - until nc -z -v -w30 $DATABASE_HOST $DATABASE_PORT; do echo waiting for postgres; sleep 2; done;
        envFrom:
        - secretRef:
            name: {{ include "order-api.fullname" . }}
      - name: migration
        image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
        imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
        command:
          - sh
          - -c
          - >
            liquibase
            --url=jdbc:postgresql://$DATABASE_HOST:$DATABASE_PORT/$DATABASE_NAME?currentSchema=public
            --changeLogFile=./changelog/changelog.yaml 
            --username=$DATABASE_USER
            --password=$DATABASE_PASSWORD
            update
        envFrom:
        - secretRef:
            name: {{ include "order-api.fullname" . }}
      containers:
      - name: order-api
        image: "{{ .Values.orderApi.image.repository }}:{{ .Values.orderApi.image.tag }}"
        imagePullPolicy: {{ .Values.orderApi.image.pullPolicy }}
        ports:
          - name: http
            containerPort: {{ .Values.service.targetPort }}
            protocol: TCP
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "order-api.fullname" . }}
        - secretRef:
            name: {{ include "order-api.fullname" . }}
