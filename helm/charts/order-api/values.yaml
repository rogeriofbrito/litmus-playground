replicaCount: 2

image:
  repository: rogeriofbrito/order-api
  pullPolicy: Always
  tag: latest

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /v1/health #TODO: change to /v1/liveness
    port: http

readinessProbe:
  httpGet:
    path: /v1/health #TODO: change to /v1/readiness
    port: http

configs:
  DATABASE_HOST: order-api-database-service.order-api-database.svc.cluster.local
  DATABASE_PORT: "5432"
  DATABASE_NAME: orderapi
  PORT: "8080"

secrets:
  DATABASE_USER: ""
  DATABASE_PASSWORD: ""
